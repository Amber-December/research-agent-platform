[project]
name = "research-agent-platform"
version = "0.1.0"
description = "Research agent platform scaffold built from PRD and tech spec"
readme = "README.md"
authors = [
    { name = "Lu Chen", email = "709910055@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.26.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
    "reportlab>=5.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
research-agent-platform = "research_agent_platform.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "research_agent_platform"
module-root = "src"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
